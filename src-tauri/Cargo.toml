[package]
name = "lazy-imagen"
version = "0.1.0"
description = "Lazy Imagen desktop"
edition = "2021"

[lib]
name = "lazy_imagen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
